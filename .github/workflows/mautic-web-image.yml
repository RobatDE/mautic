name: Build and Push Mautic Web Image

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/mautic-web-image.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/expona-ai/mautic-web-service
  MAUTIC_VER: 6.0.2
  PHP_VER: 8.3

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.MAUTIC_VER }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            PHP_VER=${{ env.PHP_VER }}
            MAUTIC_VER=${{ env.MAUTIC_VER }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
