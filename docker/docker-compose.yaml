version: '3.7'

services:
  mautic:
    image: ghcr.io/expona-ai/mautic-web-service:latest
    ports:
      - "8080:80"
    environment:
      - MAUTIC_DB_HOST=db
      - MAUTIC_DB_PORT=3306
      - MAUTIC_DB_USER=mautic
      - MAUTIC_DB_PASSWORD=mautic_password
      - MAUTIC_DB_NAME=mautic
      - MAUTIC_DB_DRIVER=pdo_mysql
      - MAUTIC_ADMIN_USERNAME=admin
      - MAUTIC_ADMIN_EMAIL=admin@expona.ai
      - MAUTIC_ADMIN_FIRSTNAME=Admin
      - MAUTIC_ADMIN_LASTNAME=User
      - MAUTIC_ADMIN_PASSWORD=NextExpona1234
      - MAUTIC_SITE_URL=http://localhost:8000
    volumes:
      - mautic_data:/var/www/html

  db:
    image: mysql:5.7
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=mautic
      - MYSQL_USER=mautic
      - MYSQL_PASSWORD=mautic_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  mautic_data:
  db_data:
